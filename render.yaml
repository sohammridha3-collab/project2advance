services:
  # ============================================================
  # 1. FastAPI Backend & Machine Learning Web Service
  # ============================================================
  - type: web
    name: healthbridge-ai
    runtime: python
    plan: free
    region: oregon
    buildCommand: git lfs install && git lfs pull && pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DATABASE_URL
        sync: false
        # Can connect to a free PostgreSQL database (e.g. from Render Postgres, Supabase, Neon)
        # Default fallback to sqlite:///./health_risk.db if left blank
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: ALLOWED_ORIGINS
        value: "https://healthbridge-frontend.onrender.com,https://project2advance-2.onrender.com,https://project2advance.onrender.com"
      - key: UPLOAD_DIRECTORY
        value: uploads/prescriptions
      - key: GIT_LFS_SKIP_SMUDGE
        value: "0"

  # ============================================================
  # 2. HealthBridge Frontend Static Site
  # ============================================================
  - type: web
    name: healthbridge-frontend
    runtime: static
    plan: free
    region: oregon
    buildCommand: node build-config.js
    staticPublishPath: .
    autoDeploy: true
    routes:
      - type: rewrite
        source: /login
        destination: /login.html
      - type: rewrite
        source: /timeline
        destination: /timeline.html
      - type: rewrite
        source: /prescription
        destination: /prescription.html
      - type: rewrite
        source: /recommendation
        destination: /recommendation.html
      - type: rewrite
        source: /problems
        destination: /problems.html
      - type: rewrite
        source: /allergies
        destination: /allergies.html
      - type: rewrite
        source: /history
        destination: /history.html
      - type: rewrite
        source: /briefing
        destination: /briefing.html
      - type: rewrite
        source: /admin
        destination: /admin.html
      - type: rewrite
        source: /share
        destination: /share.html
      - type: rewrite
        source: /result
        destination: /result.html
    envVars:
      - key: BACKEND_URL
        value: https://project2advance-2.onrender.com
